<html lang="en"><head><meta charset="utf-8"><title>StudBloxd</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;font:14px system-ui,sans-serif;color:#fff;overflow:hidden}
